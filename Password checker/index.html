<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <div class="card">
        <h1>Create Password</h1>
        <p class="subtitle">Choose a strong password to secure your account</p>

        <div class="input-group">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="new-password">
            <button type="button" id="toggleBtn" aria-label="Show password">👁</button>
        </div>

        <div class="strength-meter">
            <div class="strength-bar" id="strengthBar"></div>
        </div>
        <p class="strength-label" id="strengthLabel" aria-live="polite">Enter a password</p>

        <ul class="requirements" id="requirements">
            <li id="req-length">At least 8 characters</li>
            <li id="req-upper">One uppercase letter</li>
            <li id="req-number">One number</li>
            <li id="req-special">One special character</li>
        </ul>

        <button type="button" class="submit-btn" id="submitBtn" disabled>Create Account</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
